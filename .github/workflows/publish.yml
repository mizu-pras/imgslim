name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - run: PACKAGE_TGZ=$(npm pack) && mkdir smoke && cd smoke && npm init -y && npm install ../$PACKAGE_TGZ && npx imgslim --help

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
